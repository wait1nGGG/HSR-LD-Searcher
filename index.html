<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSR-LD-Searcher</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="bgm-btn" id="bgmBtn" title="背景音乐">🎵</button>
  <div class="char">
    <h1 class="logo">HSR-LD-Searcher</h1>

    <nav class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="image">图片搜索</button>
      <button class="mode-tab" data-mode="music">音乐搜索</button>
    </nav>

    <div class="search-wrap">
      <input type="text" id="search" class="search-input" placeholder="搜索标签..." autocomplete="off">
    </div>
  </div>

  <div class="content" id="content"></div>

  <!-- 灯箱 -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-container">
      <button class="modal-close" id="modalClose">✕</button>
      <img id="modalImage" class="modal-image" src="" alt="">
      <div class="modal-footer">
        <button id="modalDownload" class="download-btn">下载</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
