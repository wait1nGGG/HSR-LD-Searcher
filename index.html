<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSR-LD-Searcher</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="gh-btn" href="https://github.com/wait1nGGG/HSR-LD-Searcher/" target="_blank" title="GitHub">
    <svg width="18" height="18" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
  </a>
  <button class="bgm-btn" id="bgmBtn" title="背景音乐">🎵</button>
  <div class="char">
    <h1 class="logo">HSR-LD-Searcher</h1>

    <nav class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-mode="image">图片搜索</button>
      <button class="mode-tab" data-mode="music">音乐搜索</button>
    </nav>

    <div class="search-wrap">
      <input type="text" id="search" class="search-input" placeholder="搜索标签..." autocomplete="off">
    </div>
  </div>

  <div class="content" id="content"></div>

  <!-- 灯箱 -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-container">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-image-wrap" id="modalImageWrap">
        <img id="modalImage" class="modal-image" src="" alt="">
        <div class="modal-overlays" id="modalOverlays"></div>
      </div>
      <div class="modal-footer">
        <button id="modalEdit" class="edit-btn">✏️ 编辑</button>
        <button id="modalDownload" class="download-btn">下载</button>
      </div>
      <div class="edit-bar hidden" id="editBar">
        <div class="edit-controls">
          <label class="edit-label">大小</label>
          <input type="range" id="fontSizeRange" class="edit-range" min="12" max="120" value="36">
          <span class="edit-range-val" id="fontSizeVal">36</span>
          <label class="edit-label">颜色</label>
          <input type="color" id="fontColorPicker" class="edit-color" value="#ffffff">
          <button id="deleteTextBtn" class="edit-del-btn" title="删除选中文字">🗑</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
